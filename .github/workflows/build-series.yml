name: Build one Ubuntu series

on:
  workflow_call:
    inputs:
      series:
        description: Ubuntu release codename
        required: true
        type: string
      runner:
        description: GitHub runner matching the Ubuntu release
        required: true
        type: string
    secrets:
      GPG_KEY_ID:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  stage1:
    name: Stage 1
    uses: ./.github/workflows/build-stage.yml
    with:
      series: ${{ inputs.series }}
      runner: ${{ inputs.runner }}
      stage: 1
      packages: '["librime", "yoga", "fcitx5-gtk"]'
      upstream: false
    secrets: inherit

  stage2:
    name: Stage 2
    needs: stage1
    uses: ./.github/workflows/build-stage.yml
    with:
      series: ${{ inputs.series }}
      runner: ${{ inputs.runner }}
      stage: 2
      packages: '["fcitx5"]'
      upstream: true
    secrets: inherit

  stage3:
    name: Stage 3
    needs: stage2
    uses: ./.github/workflows/build-stage.yml
    with:
      series: ${{ inputs.series }}
      runner: ${{ inputs.runner }}
      stage: 3
      packages: '["libime", "fcitx5-lua", "fcitx5-qt", "fcitx5-rime"]'
      upstream: true
    secrets: inherit

  stage4:
    name: Stage 4
    needs: stage3
    uses: ./.github/workflows/build-stage.yml
    with:
      series: ${{ inputs.series }}
      runner: ${{ inputs.runner }}
      stage: 4
      packages: '["fcitx5-chinese-addons"]'
      upstream: true
    secrets: inherit
