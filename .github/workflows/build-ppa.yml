name: Build and upload to PPA

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-ppa.yml'
      - '.github/workflows/build-series.yml'
      - '.github/workflows/build-stage.yml'
      - '.github/actions/**'
      - 'scripts/**'
      - 'patches/**'
      - 'debian-patches/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ppa-upload
  cancel-in-progress: false

# Independent series build concurrently; only source upload jobs hold the PPA lock.
jobs:
  build:
    name: Build ${{ matrix.series }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        series: [noble, resolute]
        include:
          - series: noble
            runner: ubuntu-24.04
          - series: resolute
            runner: ubuntu-26.04
    uses: ./.github/workflows/build-series.yml
    with:
      series: ${{ matrix.series }}
      runner: ${{ matrix.runner }}
    secrets:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
