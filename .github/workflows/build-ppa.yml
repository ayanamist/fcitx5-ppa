name: Build and upload to PPA

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-ppa.yml'
      - '.github/actions/**'
      - 'scripts/**'
      - 'patches/**'
      - 'debian-patches/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ppa-upload
  cancel-in-progress: false

env:
  OWNER: ${{ vars.OWNER }}
  PPA: ${{ vars.PPA }}
  SERIES: noble
  DEBEMAIL: ${{ vars.DEBEMAIL }}
  DEBFULLNAME: ${{ vars.OWNER }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  stage1:
    name: Stage 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [librime, yoga, fcitx5-gtk]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ppa-env
        with:
          gpg-key-id: ${{ secrets.GPG_KEY_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          series: ${{ env.SERIES }}
          owner: ${{ env.OWNER }}
          ppa: ${{ env.PPA }}
      - name: Resolve deb version
        id: ver
        run: |
          chmod +x scripts/*.sh
          scripts/resolve-deb-version.sh "${{ matrix.package }}"
      - name: Cache own debs
        uses: actions/cache@v6
        with:
          key: debs-${{ matrix.package }}-${{ env.SERIES }}-${{ steps.ver.outputs.deb_version }}
          path: ~/deb-cache/${{ matrix.package }}
      - name: Build and upload
        id: build
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x scripts/*.sh
          export DEB_CACHE_DIR="$HOME/deb-cache/${{ matrix.package }}"
          scripts/build-and-upload.sh "${{ matrix.package }}"
      - name: Upload debs for downstream stages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.package }}
          path: ~/deb-cache/${{ matrix.package }}/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  stage2:
    name: Stage 2
    needs: stage1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [fcitx5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ppa-env
        with:
          gpg-key-id: ${{ secrets.GPG_KEY_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          series: ${{ env.SERIES }}
          owner: ${{ env.OWNER }}
          ppa: ${{ env.PPA }}
      - name: Resolve deb version (self)
        id: ver
        run: |
          chmod +x scripts/*.sh
          scripts/resolve-deb-version.sh "${{ matrix.package }}"
      - name: Cache own debs
        uses: actions/cache@v6
        with:
          key: debs-${{ matrix.package }}-${{ env.SERIES }}-${{ steps.ver.outputs.deb_version }}
          path: ~/deb-cache/${{ matrix.package }}
      # Cross-stage handoff must use this run's outputs: an exact cache hit
      # cannot be overwritten when the same Debian version is rebuilt as ppaN+1.
      - name: Download upstream debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: ${{ runner.temp }}/upstream-debs
      - name: Build local apt repo
        run: |
          chmod +x scripts/*.sh
          scripts/build-local-repo.sh "${{ runner.temp }}/upstream-debs" "${{ runner.temp }}/local-repo"
      - name: Build and upload
        id: build
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOCAL_REPO_DIR: ${{ runner.temp }}/local-repo
        run: |
          chmod +x scripts/*.sh
          export DEB_CACHE_DIR="$HOME/deb-cache/${{ matrix.package }}"
          scripts/build-and-upload.sh "${{ matrix.package }}"
      - name: Upload debs for downstream stages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.package }}
          path: ~/deb-cache/${{ matrix.package }}/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  stage3:
    name: Stage 3
    needs: stage2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [libime, fcitx5-lua, fcitx5-qt, fcitx5-rime]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ppa-env
        with:
          gpg-key-id: ${{ secrets.GPG_KEY_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          series: ${{ env.SERIES }}
          owner: ${{ env.OWNER }}
          ppa: ${{ env.PPA }}
      - name: Resolve deb version (self)
        id: ver
        run: |
          chmod +x scripts/*.sh
          scripts/resolve-deb-version.sh "${{ matrix.package }}"
      - name: Cache own debs
        uses: actions/cache@v6
        with:
          key: debs-${{ matrix.package }}-${{ env.SERIES }}-${{ steps.ver.outputs.deb_version }}
          path: ~/deb-cache/${{ matrix.package }}
      # Cross-stage handoff must use this run's outputs: an exact cache hit
      # cannot be overwritten when the same Debian version is rebuilt as ppaN+1.
      - name: Download upstream debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: ${{ runner.temp }}/upstream-debs
      - name: Build local apt repo
        run: |
          chmod +x scripts/*.sh
          scripts/build-local-repo.sh "${{ runner.temp }}/upstream-debs" "${{ runner.temp }}/local-repo"
      - name: Build and upload
        id: build
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOCAL_REPO_DIR: ${{ runner.temp }}/local-repo
        run: |
          chmod +x scripts/*.sh
          export DEB_CACHE_DIR="$HOME/deb-cache/${{ matrix.package }}"
          scripts/build-and-upload.sh "${{ matrix.package }}"
      - name: Upload debs for downstream stages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.package }}
          path: ~/deb-cache/${{ matrix.package }}/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  stage4:
    name: Stage 4
    needs: stage3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [fcitx5-chinese-addons]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ppa-env
        with:
          gpg-key-id: ${{ secrets.GPG_KEY_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          series: ${{ env.SERIES }}
          owner: ${{ env.OWNER }}
          ppa: ${{ env.PPA }}
      - name: Resolve deb version (self)
        id: ver
        run: |
          chmod +x scripts/*.sh
          scripts/resolve-deb-version.sh "${{ matrix.package }}"
      - name: Cache own debs
        uses: actions/cache@v6
        with:
          key: debs-${{ matrix.package }}-${{ env.SERIES }}-${{ steps.ver.outputs.deb_version }}
          path: ~/deb-cache/${{ matrix.package }}
      # Cross-stage handoff must use this run's outputs: an exact cache hit
      # cannot be overwritten when the same Debian version is rebuilt as ppaN+1.
      - name: Download upstream debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: ${{ runner.temp }}/upstream-debs
      - name: Build local apt repo
        run: |
          chmod +x scripts/*.sh
          scripts/build-local-repo.sh "${{ runner.temp }}/upstream-debs" "${{ runner.temp }}/local-repo"
      - name: Build and upload
        id: build
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOCAL_REPO_DIR: ${{ runner.temp }}/local-repo
        run: |
          chmod +x scripts/*.sh
          export DEB_CACHE_DIR="$HOME/deb-cache/${{ matrix.package }}"
          scripts/build-and-upload.sh "${{ matrix.package }}"
